<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雍贤山庐 7-1004 装修预算总表</title>
<script>
(function(){
  try{
    const theme=localStorage.getItem('yxsl_budget_theme');
    if(theme==='dark') document.documentElement.dataset.theme='dark';
  }catch(e){}
})();
</script>
<style>
:root{
  --dark:#214E3B; --green:#376B55; --gold:#C79A52; --red:#C95252;
  --saving:#2F6E8F; --saving-soft:#E7F3F7;
  --bg:#F4F7F5; --card:#FFFFFF; --line:#E3EAE5; --ink:#24312B; --muted:#6D7771;
  --paid-bg:#E5F3E9; --budget-bg:#FBF7EF; --unpaid-bg:#FCE8E6;
  --body-bg:linear-gradient(135deg,#EDF4EF 0%,#F4F7F5 100%);
  --shadow:rgba(33,78,59,.08); --shadow-strong:rgba(33,78,59,.18);
  --header-start:#214E3B; --header-end:#376B55; --primary-bg:#214E3B; --primary-fg:#FFFFFF;
  --chart-budget:#8F5F20; --chart-paid:#245E46; --chart-zero:#82908A;
}
:root[data-theme="dark"]{
  --dark:#D9EFE4; --green:#A7D8BD; --gold:#D6A95E; --red:#E17870;
  --saving:#82C4DE; --saving-soft:#17313A;
  --bg:#111815; --card:#18231E; --line:#2B3A33; --ink:#EDF5F0; --muted:#A9B9B0;
  --paid-bg:#1D3429; --budget-bg:#302817; --unpaid-bg:#3A2221;
  --body-bg:linear-gradient(135deg,#0E1512 0%,#16211C 100%);
  --shadow:rgba(0,0,0,.28); --shadow-strong:rgba(0,0,0,.42);
  --header-start:#14221C; --header-end:#203A2F; --primary-bg:#274637; --primary-fg:#FFFFFF;
  --chart-budget:#E0B66D; --chart-paid:#99D4B5; --chart-zero:#93A39A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--body-bg);
  color:var(--ink); line-height:1.5; padding-bottom:118px; overflow-x:hidden;
}
/* ===== 顶部标题 ===== */
header{
  background:linear-gradient(120deg,var(--header-start),var(--header-end));
  color:#fff; padding:24px; position:relative; overflow:hidden;
  box-shadow:0 4px 20px rgba(33,78,59,.25);
}
header::after{
  content:""; position:absolute; inset:auto 0 0 0; height:1px;
  background:rgba(255,255,255,.18);
}
header h1{font-size:26px; font-weight:700; letter-spacing:1px; animation:slideDown .8s cubic-bezier(.2,.8,.2,1)}
header p{color:rgba(255,255,255,.8); font-size:13px; margin-top:6px; animation:slideDown .8s .1s backwards}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.countdown{
  display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;
  color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;font-weight:700;
  box-shadow:inset 0 1px rgba(255,255,255,.2);animation:slideDown .8s .18s backwards;
}
.countdown::before{content:"⌂";color:#FFE1A6;font-size:15px}
.countdown-title{color:rgba(255,255,255,.82);font-weight:600}
.countdown-time{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.countdown-unit{display:inline-flex;align-items:baseline;gap:3px}
.countdown-num{
  min-width:2.8ch;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.18);
  color:#FFE1A6;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px rgba(255,255,255,.16);
}
.countdown-unit:first-child .countdown-num{min-width:3.6ch}
.countdown-label{font-size:11px;color:rgba(255,255,255,.72);font-weight:600}
.header-timeline{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;
  color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;font-weight:700;
  text-decoration:none;box-shadow:inset 0 1px rgba(255,255,255,.2);transition:transform .2s,background .2s,box-shadow .2s;
  animation:slideDown .8s .24s backwards;white-space:nowrap;
}
.header-timeline::before{content:"◷";color:#FFE1A6;font-size:16px}
.header-timeline:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.header-timeline:active{transform:scale(.97)}
@keyframes slideDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
/* ===== KPI 卡片 ===== */
.kpis{
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
  max-width:1280px; margin:18px auto 0; padding:0 24px; position:relative; z-index:5;
}
.kpi{
  background:var(--card); border-radius:8px; padding:14px;
  box-shadow:0 6px 20px var(--shadow); border:1px solid var(--line);
  opacity:0; transform:translateY(30px); animation:pop .6s forwards;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  position:relative; overflow:hidden;
}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .4s}
.kpi:hover::before{transform:scaleX(1)}
.kpi:hover{transform:translateY(-1px); box-shadow:0 8px 18px var(--shadow-strong)}
.kpi:nth-child(1){animation-delay:.05s}.kpi:nth-child(2){animation-delay:.12s}
.kpi:nth-child(3){animation-delay:.19s}.kpi:nth-child(4){animation-delay:.26s}
.kpi:nth-child(5){animation-delay:.33s}.kpi:nth-child(6){animation-delay:.40s}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
.kpi .label{font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:5px}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi .value{font-size:26px; font-weight:800; color:var(--dark); line-height:1.15}
.kpi .value.money::before{content:"¥"; font-size:14px; opacity:.6; margin-right:1px}
/* ===== 工具条 ===== */
.toolbar{
  max-width:1280px; margin:26px auto 14px; padding:0 24px;
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
}
.search{
  flex:1; min-width:200px; padding:11px 16px; border:1px solid var(--line); border-radius:10px;
  font-size:14px; background:var(--card); color:var(--ink); transition:.2s; outline:none;
}
.search:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,154,82,.15)}
.btn{
  padding:11px 18px; border:none; border-radius:10px; cursor:pointer; font-size:14px;
  font-weight:600; transition:transform .2s, box-shadow .2s, background .2s, border-color .2s; font-family:inherit;
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
}
.btn-primary{background:var(--primary-bg); color:var(--primary-fg)}
.btn-primary:hover{background:var(--header-end); transform:translateY(-1px); box-shadow:0 6px 16px rgba(33,78,59,.25)}
.btn-ghost{background:var(--card); color:var(--dark); border:1px solid var(--line)}
.btn-ghost:hover{background:var(--bg); transform:translateY(-1px)}
.btn:active,.chip:active,.status-badge:active{transform:scale(.96)}
.btn-mini{padding:6px 10px;border-radius:8px;font-size:12px}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:transform .2s, border-color .2s, background .2s}
.chip:hover{border-color:var(--green);transform:scale(1.06)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
/* ===== 阶段块 ===== */
.stage{
  max-width:1280px; margin:0 auto 22px; padding:0 24px;
  opacity:0; transform:translateY(24px);
}
.stage.in{animation:rise .6s forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.stage-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:linear-gradient(100deg,var(--header-start) 0%,var(--header-end) 60%,#2f6650 100%); color:#fff;
  padding:13px 18px; border-radius:8px 8px 0 0; cursor:pointer;
  box-shadow:0 4px 14px rgba(33,78,59,.18); position:relative; overflow:hidden;
  transition:box-shadow .3s, transform .3s;
}
.stage-head::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(100deg,transparent 40%,rgba(199,154,82,.18) 100%);
  opacity:0; transition:opacity .35s;
}
.stage-head:hover{box-shadow:0 8px 22px rgba(33,78,59,.28)}
.stage-head:hover::before{opacity:1}
.stage-head:hover .caret{transform:scale(1.18)}
.stage-head h2{font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; letter-spacing:.5px; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,.18)}
.stage-head .caret{transition:transform .3s}
.stage.collapsed .caret{transform:rotate(-90deg)}
.stage.collapsed .stage-head:hover .caret{transform:rotate(-90deg) scale(1.18)}
.stage-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:1}
.stage-pin{
  background:rgba(255,241,208,.95); color:#7A4F08; border:1px solid rgba(255,255,255,.4);
  border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700; text-shadow:none;
}
.stage.pinned .stage-head{background:linear-gradient(100deg,#7A4F08 0%,#A46D16 58%,#C79A52 100%)}
.stage.pinned{order:-1}
.stage-sum{font-size:13px; color:#fff; display:flex; gap:16px; flex-wrap:wrap; z-index:1}
.stage-sum span{background:rgba(255,255,255,.18); padding:3px 12px; border-radius:20px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.stage-sum b{color:#FFE1A6; font-weight:700}
.table-wrap{background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 8px 8px; overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch; transition:max-height .4s ease, opacity .3s; box-shadow:0 4px 14px var(--shadow)}
/* 回款节点：区别于普通节点的配色 */
.stage.rebate .stage-head{background:linear-gradient(100deg,#7A5B12 0%,#A97E22 60%,#C79A52 100%)}
.stage.rebate thead th{background:#8A6A1C}
.stage.rebate td.rebate .cell{color:#A97112; font-weight:700}
.stage.rebate .stage-sum b{color:#FFF1D0}
.stage.saving .stage-head{background:linear-gradient(100deg,#17495F 0%,#2F6E8F 58%,#6CB1C7 100%)}
.stage.saving thead th{background:#245C76}
.stage.saving td.saving .cell{background:var(--saving-soft);color:var(--saving);font-weight:800}
.stage.saving .stage-sum b{color:#D8F6FF}
.stage.collapsed .table-wrap{max-height:0!important; opacity:0; border:none}
table{width:100%;min-width:1040px; border-collapse:collapse; font-size:13px}
thead th{
  background:var(--header-start); color:#fff; font-weight:600; padding:12px 12px; text-align:left;
  position:sticky; top:0; white-space:nowrap; font-size:12px;
}
thead th:first-child{padding-left:22px}
thead th.thmoney{text-align:right; padding-right:22px}
thead th.thcenter{text-align:center}
thead th:nth-child(2),tbody td:nth-child(2){min-width:62px}
thead th:nth-child(8),tbody td:nth-child(8){min-width:104px}
tbody td:first-child .cell{margin-left:12px}
tbody td.money .cell{margin-right:12px}
tbody td{padding:0; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--bg)}
tbody tr:hover .cell{background:transparent}
.budget-row{animation:rowIn .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
tfoot td{border-top:1px solid var(--line);background:var(--bg);padding:8px 12px}
.add-row-btn{width:100%;min-width:132px;white-space:nowrap;text-align:left;background:var(--card);color:var(--dark);border:1px dashed var(--gold)}
.add-row-btn:hover{background:var(--budget-bg)}
.delete-row-btn{color:var(--red);border-color:rgba(201,82,82,.28);background:var(--card)}
.delete-row-btn:hover{background:var(--unpaid-bg);transform:scale(1.06)}
.cell{
  padding:10px; min-height:38px; cursor:text; transition:.15s; outline:none;
  border:2px solid transparent; border-radius:6px; margin:2px;
  flex:1; white-space:nowrap; box-shadow:inset 0 -1px rgba(199,154,82,.18);
}
.date-picker{
  position:relative;display:block;margin:2px;min-width:138px;border-radius:8px;
}
.date-picker .date-input{
  display:block;width:100%;min-height:38px;margin:0;padding:9px 11px;border:1px solid transparent;border-radius:8px;
  background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(199,154,82,.1));color:var(--ink);cursor:pointer;
  font:700 12px/1.2 inherit;font-variant-numeric:tabular-nums;box-shadow:inset 0 -1px rgba(199,154,82,.16);
}
.date-display{display:none}
.date-display::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(199,154,82,.16);
}
.date-picker.empty .date-display{color:var(--muted);font-weight:600}
.date-picker.empty .date-display::before{background:var(--muted);box-shadow:0 0 0 4px rgba(109,119,113,.12)}
.date-picker:hover .date-display,.date-picker:focus-within .date-display{
  border-color:rgba(199,154,82,.42);background:var(--card);box-shadow:0 0 0 3px rgba(199,154,82,.12),inset 0 -1px rgba(199,154,82,.18);
}
.cell:hover{background:var(--bg); border-color:rgba(199,154,82,.26)}
.cell:focus{background:var(--card); border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,154,82,.12)}
.cell.saved{animation:flash .7s}
@keyframes flash{0%{background:#C6EFCE}100%{background:transparent}}
tbody td:nth-child(2) .cell,tbody td:nth-child(8) .cell,.tdstatus{white-space:nowrap}
.tdactions{text-align:center;white-space:nowrap;min-width:74px}
td.money .cell{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
td.budget .cell{background:var(--budget-bg)}
td.paid .cell{color:var(--green); font-weight:600}
td.unpaid .cell{color:var(--red); font-weight:600}
.status-badge{
  display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600;
  cursor:pointer; user-select:none; transition:.2s;
}
.status-badge.done{background:#C6EFCE; color:#227A3D}
.status-badge.todo{background:#FFE7C2; color:#B9600F}
.status-badge:hover{transform:scale(1.12)}
/* ===== toast ===== */
#toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--dark); color:#fff; padding:12px 22px; border-radius:30px; font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; transition:.4s cubic-bezier(.2,.8,.2,1); z-index:99;
}
#toast.show{transform:translateX(-50%) translateY(0); opacity:1}
/* ===== back to top ===== */
/* ===== 悬浮操作按钮组 ===== */
.fab{position:fixed;right:22px;border-radius:50%;width:48px;height:48px;border:none;cursor:pointer;font-size:20px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s,box-shadow .3s;z-index:50;display:flex;align-items:center;justify-content:center}
.fab.show{opacity:1;pointer-events:auto}
.fab:active{transform:scale(.9)}
#top{bottom:26px;background:var(--gold)}
#top:hover{transform:translateY(-4px) rotate(360deg);transition:transform .5s,opacity .3s}
#toStart{bottom:84px;background:var(--dark);font-size:22px}
#toStart:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(33,78,59,.4)}
.fab .tip{position:absolute;right:56px;white-space:nowrap;background:rgba(36,49,43,.92);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;opacity:0;transform:translateX(6px);transition:.25s;pointer-events:none}
.fab:hover .tip{opacity:1;transform:translateX(0)}
@media(hover:none){.fab .tip{display:none}}
/* ===== progress bar ===== */
.progress-wrap{max-width:1280px;margin:0 auto 8px;padding:0 24px}
.progress-track{height:10px;background:#E3EAE5;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0;border-radius:10px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.achievement-strip{
  margin-top:10px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;
  background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.42);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 24px var(--shadow);border-radius:8px;padding:10px;
}
:root[data-theme="dark"] .achievement-strip{background:rgba(24,35,30,.62);border-color:rgba(255,255,255,.08)}
.achievement-item{min-width:0;border-left:3px solid var(--gold);padding-left:10px}
.achievement-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.achievement-value{font-size:14px;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burst-piece{position:fixed;width:6px;height:10px;border-radius:2px;pointer-events:none;z-index:200;animation:burstFly .8s ease-out forwards}
@keyframes burstFly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.burst-piece{display:none}}
/* ===== 图表区 ===== */
.charts{max-width:1280px;margin:20px auto 8px;padding:0 24px;display:grid;grid-template-columns:2fr 1fr;gap:18px}
.chart-card{
  background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.48);border-radius:8px;padding:16px 18px;
  backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);
  box-shadow:0 4px 14px var(--shadow),inset 0 1px rgba(255,255,255,.48);opacity:0;transform:translateY(24px) scale(.985);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .34s,border-color .34s,opacity .5s;
  position:relative;overflow:hidden;will-change:transform;
}
:root[data-theme="dark"] .chart-card{background:rgba(24,35,30,.58);border-color:rgba(255,255,255,.1);box-shadow:0 4px 14px var(--shadow),inset 0 1px rgba(255,255,255,.08)}
.chart-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 34%,rgba(255,255,255,.22) 50%,transparent 66%);
  transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
.chart-card.in{opacity:1;transform:translateY(0) scale(1)}
.chart-card:hover{
  box-shadow:0 18px 38px var(--shadow-strong),inset 0 1px rgba(255,255,255,.62);transform:translateY(-8px) scale(1.035);
  border-color:rgba(199,154,82,.62);
}
.chart-card:hover::after{transform:translateX(120%)}
.chart-card h3{font-size:15px;color:var(--dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:700}
.chart-card h3::before{content:"";width:5px;height:16px;background:var(--gold);border-radius:3px}
.chart-card canvas{width:100%;display:block}
.chart-donut canvas{max-height:240px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend-budget{background:var(--chart-budget)}
.legend-paid{background:var(--chart-paid)}
@media(prefers-reduced-motion:reduce){
  .chart-card,.chart-card::after{transition:none}
  .chart-card:hover{transform:none}
}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.progress-label{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}
/* ===== 响应式 ===== */
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .fab{left:14px;right:auto;width:44px;height:44px}
  .fab .tip{left:54px;right:auto}
}
@media(max-width:600px){
  header{padding:24px 16px}
  header h1{font-size:19px}
  header p{font-size:12px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-22px;padding:0 14px}
  .kpi{padding:14px 12px;border-radius:13px}
  .kpi .value{font-size:19px}
  .kpi .label{font-size:11px}
  .progress-wrap,.charts,.toolbar,.stage,.footer{padding-left:14px;padding-right:14px}
  .achievement-strip{grid-template-columns:1fr}
  .toolbar{gap:8px}
  .search{min-width:0;flex:1 1 100%}
  .chip{flex:1;text-align:center}
  .btn{flex:1;padding:10px 8px;font-size:13px}
  /* 表格横向滚动，保留所有列 */
  .stage:not(.collapsed) .table-wrap{max-height:none}
  table{min-width:1040px}
  .stage-head{padding:12px 16px;flex-wrap:wrap;gap:8px}
  .stage-head h2{font-size:15px}
  .stage-sum{font-size:11px;gap:6px}
  .stage-sum span{padding:2px 8px}
  .cell{font-size:12px;padding:9px 8px;min-height:40px}
  .header-actions{align-items:stretch;flex-wrap:nowrap;gap:8px}
  .countdown{align-items:flex-start;border-radius:12px;flex:1;flex-direction:column;gap:6px;padding:8px 10px}
  .countdown-time{flex-wrap:wrap}
  .header-timeline{border-radius:12px;padding:8px 10px;flex-direction:column;min-width:72px}
  thead th{font-size:11px;padding:10px 8px}
  thead th:first-child{padding-left:14px}
  /* 触摸友好：状态徽章与按钮更大点击区 */
  .status-badge{padding:6px 14px;font-size:12px}
  .fab{width:52px;height:52px}
  #toStart{bottom:88px}
}
@media(max-width:600px) and (hover:none){
  .kpi:active{transform:scale(.98)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .kpi,.stage,.budget-row,header h1,header p{animation:none!important;opacity:1!important;transform:none!important}
}
.hidden{display:none!important}
.footer{max-width:1280px;margin:30px auto 0;padding:0 24px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>雍贤山庐 7-1004 装修预算总表</h1>
  <p>127㎡ 毛坯住宅</p>
  <div class="header-actions">
    <div class="countdown" id="moveCountdown">距离搬进新家还有--天--小时--分钟--秒</div>
    <a class="header-timeline" href="timeline.html">装修时间线</a>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
  <div class="progress-label" id="progLabel"></div>
  <div class="achievement-strip" id="achievementStrip">
    <div class="achievement-item">
      <div class="achievement-label">完成率</div>
      <div class="achievement-value" id="achPct">0%</div>
    </div>
    <div class="achievement-item">
      <div class="achievement-label">已完成</div>
      <div class="achievement-value" id="achDone">0 项</div>
    </div>
    <div class="achievement-item">
      <div class="achievement-label">当前推进</div>
      <div class="achievement-value" id="achCurrent">-</div>
    </div>
  </div>
</div>

<div class="charts">
  <div class="chart-card chart-bar">
    <h3>各阶段 预算 vs 已付款</h3>
    <canvas id="barChart" height="300"></canvas>
    <div class="legend">
      <span><i class="legend-budget"></i>预算款</span>
      <span><i class="legend-paid"></i>已付款</span>
    </div>
  </div>
  <div class="chart-card chart-donut">
    <h3>整体资金构成</h3>
    <canvas id="donutChart" height="240"></canvas>
    <div class="legend" id="donutLegend"></div>
  </div>
</div>


<div class="toolbar">
  <input class="search" id="search" placeholder="🔍 搜索项目名称 / 类别 / 空间 / 备注…">
  <span class="chip active" data-f="all">全部</span>
  <span class="chip" data-f="done">已完成</span>
  <span class="chip" data-f="todo">未完成</span>
  <button class="btn btn-ghost" id="expandAll">展开/收起全部</button>
  <button class="btn btn-ghost" id="themeToggle" title="切换明暗模式">深色模式</button>
  <button class="btn btn-ghost hidden" id="exportBtn">⬇ 导出数据</button>
  <button class="btn btn-ghost hidden" id="importBtn">⬆ 导入数据</button>
  <button class="btn btn-primary" id="reset">恢复初始数据</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none">
</div>

<div id="stages"></div>

<div class="footer">共 <span id="nodeCount"></span> 个节点 · 点击任意单元格即可编辑，修改自动保存 · 点状态标签可切换完成状态</div>

<button id="toStart" class="fab" title="回到流程开始">⚑<span class="tip">回到流程开始</span></button>
<button id="top" class="fab">↑<span class="tip">回到顶部</span></button>
<div id="toast"></div>

  if(!res.ok) throw new Error(`读取云端失败 ${res.status}`);
  const rows = await res.json();
  return rows[0] || null;
}
function applyCloudDoc(doc, quiet){
  if(!doc || !Array.isArray(doc.data)) return;
  DATA = normalizeData(doc.data);
  cloudUpdatedAt = doc.updated_at || cloudUpdatedAt;
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  renderKPI(); renderStages();
  if(!quiet) toast("已同步云端数据");
}
async function initCloudData(){
  try{
    const doc = await fetchCloudDoc();
    if(doc) applyCloudDoc(doc,true);
    setInterval(refreshCloudData,15000);
  }catch(e){

}
async function refreshCloudData(){
  if(cloudSaving || applyingRemote) return;
  try{
    const doc = await fetchCloudDoc();
    if(doc && doc.updated_at && doc.updated_at !== cloudUpdatedAt){
      applyingRemote = true;
      applyCloudDoc(doc,false);
      applyingRemote = false;
    }
  }catch(e){ console.warn(e); }
}

// ====== KPI 计算 ======
function calcKPI(){
  let budget=0,paid=0,saved=0,done=0,todo=0;
  DATA.forEach(s=>{
    if(s.kind==="savings"){s.items.forEach(it=>saved+=Number(it.saved)||0); return;}
    if(s.noStat) return; s.items.forEach(it=>{
    budget+=Number(it.budget)||0; paid+=Number(it.paid)||0;
    if(it.status==='已完成')done++; else if(it.status==='未完成')todo++;
  });});
  return {budget,paid,saved,remain:budget-paid,done,todo};
}
// ====== 数字增量动画 ======
function animateNumber(el, to, money){
  const from = el._cur || 0;
  if(prefersReducedMotion()){el.textContent = money?fmt(to):to; el._cur=to; return;}
  if(from===to){el.textContent = money?fmt(to):to; el._cur=to; return;}
  const dur = 700, t0 = performance.now();
  const ease = t => 1-Math.pow(1-t,3);
  function step(now){
    const p = Math.min((now-t0)/dur, 1);
    const val = from + (to-from)*ease(p);
    el.textContent = money ? fmt(Math.round(val)) : Math.round(val);
    if(p<1) requestAnimationFrame(step);
    else { el.textContent = money?fmt(to):to; el._cur = to; }
  }
  el._cur = from;
  requestAnimationFrame(step);
}

const KPI_DEFS=[
  {key:'budget',l:'总预算',c:'var(--chart-budget)',money:1},
  {key:'paid',l:'已付款',c:'var(--chart-paid)',money:1},
  {key:'remain',l:'待安排资金',c:'var(--dark)',money:1},
  {key:'saved',l:'特别省下',c:'var(--saving)',money:1},
];
let kpiBuilt=false;
let lastKpiSignature='';
function buildKPI(){
  document.getElementById('kpis').innerHTML = KPI_DEFS.map(c=>`
    <div class="kpi" style="--accent:${c.c}">
      <div class="label"><span class="dot" style="background:${c.c}"></span>${c.l}</div>
      <div class="value ${c.money?'money':''}" data-key="${c.key}">0</div>
    </div>`).join('');
  kpiBuilt=true;
}
function renderKPI(){
  const k=calcKPI();
  const signature=JSON.stringify(k);
  const changed=signature!==lastKpiSignature;
  lastKpiSignature=signature;
  if(!kpiBuilt) buildKPI();
  KPI_DEFS.forEach(c=>{
    const el=document.querySelector(`.value[data-key="${c.key}"]`);
    animateNumber(el, Math.round(k[c.key]), c.money);
  });
  const pct = k.done+k.todo ? Math.round(k.done/(k.done+k.todo)*100) : 0;
  setTimeout(()=>{document.getElementById('progFill').style.width=pct+'%';},200);
  document.getElementById('progLabel').textContent='节点完成进度';
  const achPct=document.getElementById('achPct');
  const achDone=document.getElementById('achDone');
  const achCurrent=document.getElementById('achCurrent');
  if(achPct) achPct.textContent=pct+'%';
  if(achDone) achDone.textContent=`${k.done} / ${k.done+k.todo} 项`;
  if(achCurrent) achCurrent.textContent=currentStageName();
  const nc=document.getElementById('nodeCount'); if(nc)nc.textContent=k.done+k.todo;
  if(changed) drawCharts();
}

const COLS=[

  {k:'status',t:'状态'},{k:'brand',t:'品牌/规格'},
  {k:'budget',t:'预算款',cls:'money budget'},{k:'paid',t:'已付款',cls:'money paid'},{k:'note',t:'备注'}
];
// 回款节点专属列：不显示预算/状态，只展示回收款
const REBATE_COLS=[
  {k:'name',t:'回款项目'},{k:'space',t:'空间'},
  {k:'paid',t:'回收金额',cls:'money rebate'},{k:'date',t:'日期'},{k:'note',t:'备注'}
];
const SAVING_COLS=[
  {k:'name',t:'省钱项目'},{k:'space',t:'空间'},
  {k:'saved',t:'省下金额',cls:'money saving'},{k:'date',t:'日期'},{k:'note',t:'备注'}
];
function match(it){
  if(filter==='done'&&it.status!=='已完成')return false;
  if(filter==='todo'&&it.status!=='未完成')return false;
  if(keyword){
    const hay=(it.cat+it.space+it.name+it.brand+it.note+it.saved).toLowerCase();
    if(!hay.includes(keyword.toLowerCase()))return false;
  }
  return true;
}
function stageSum(s){
  let b=0,p=0,saved=0;
  s.items.forEach(it=>{b+=Number(it.budget)||0;p+=Number(it.paid)||0;saved+=Number(it.saved)||0;});
  return {b,p,saved};
}
function stageOrder(s){
  const m=String(s.stage||'').match(/^(\d+)/);
  return m ? Number(m[1]) : 9999;
}
function orderedStageEntries(){
  return DATA.map((s,si)=>({s,si})).sort((a,b)=>{
    if(!!a.s.pinned!==!!b.s.pinned) return a.s.pinned ? -1 : 1;
    return stageOrder(a.s)-stageOrder(b.s) || a.si-b.si;
  });
}
function currentStageName(){
  const pinned=orderedStageEntries().find(({s})=>s.pinned);
  const active=pinned || orderedStageEntries().find(({s})=>!s.noStat && s.kind!=="savings" && s.items.some(it=>it.status!=='已完成'));
  if(!active) return '全部完成';
  return active.s.stage.replace(/^\d+\s*/,'');
}
function emptyItemForStage(s){
  if(s.kind==="savings") return {cat:"省钱",space:"",name:"",brand:"",budget:0,paid:0,unpaid:0,saved:0,date:"",status:"已完成",note:""};
  if(s.noStat) return {cat:"回款",space:"",name:"",brand:"",budget:0,paid:0,unpaid:0,date:"",status:"已完成",note:""};
  return {cat:"",space:"",name:"",brand:"",budget:0,paid:0,unpaid:0,date:"",status:"未完成",note:""};
}
function rowHtml(it,si,ii,cols){
  const tds=cols.map(col=>{

      return `<td class="tdstatus" style="text-align:center"><span class="status-badge ${done?'done':'todo'}" data-si="${si}" data-ii="${ii}">${it.status||'未完成'}</span></td>`;
    }

      const value=dateValue(it.date);

    }
    const isMoney=col.cls&&col.cls.includes('money');
    const val=isMoney?fmt(it[col.k]):(it[col.k]||'');
    return `<td class="${col.cls||''}"><div class="cell" contenteditable="true" data-si="${si}" data-ii="${ii}" data-k="${col.k}" data-money="${isMoney?1:0}">${escapeHtml(val)}</div></td>`;

function renderStages(){
  const box=document.getElementById('stages'); box.innerHTML='';
  orderedStageEntries().forEach(({s,si})=>{

    if(!visible.length && (keyword||filter!=='all')) return;

    const isRebate=!!s.noStat&&!isSaving;

      : (isRebate
        ? `<span>回收合计 <b>¥${fmt(sum.p)}</b></span><span>${s.items.length} 项</span>`
        : `<span>预算 <b>¥${fmt(sum.b)}</b></span><span>已付 ¥${fmt(sum.p)}</span><span>${s.items.length} 项</span>`);

// ====== 编辑与保存 ======
function fireCompletionBurst(el){
  if(!el || prefersReducedMotion()) return;
  const rect=el.getBoundingClientRect();
  const colors=[cssVar('--gold')||'#C79A52',cssVar('--green')||'#376B55',cssVar('--red')||'#C95252','#ffffff'];
  for(let i=0;i<18;i++){
    const p=document.createElement('span');
    const angle=(i/18)*Math.PI*2;
    const distance=42+Math.random()*36;
    p.className='burst-piece';
    p.style.left=(rect.left+rect.width/2)+'px';
    p.style.top=(rect.top+rect.height/2)+'px';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
    p.style.setProperty('--dy',(Math.sin(angle)*distance-18)+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}
function bindCell(cell){
  cell.addEventListener('blur',function(){
    const {si,ii,k}=this.dataset; const money=this.dataset.money==='1';
    let v=this.textContent.trim();
    if(money){v=v.replace(/[,¥\s]/g,''); v=v===''?0:(parseFloat(v)||0); this.textContent=fmt(v);}
    const old=DATA[si].items[ii][k];
    const same=money ? (Number(old)||0)===(Number(v)||0) : String(old||'')===String(v||'');
    if(same) return;
    if(!ensureEditAllowed()){
      this.textContent=money?fmt(old):(old||'');
      return;
    }
    DATA[si].items[ii][k]=v;
    saveData(); renderKPI();
    this.classList.add('saved'); setTimeout(()=>this.classList.remove('saved'),700);
    toast('已保存 ✓');
    refreshStageSum(si);
  });
  cell.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.blur();}
  });
}
function bindStatusBadge(b){
  b.addEventListener('click',function(){
    const {si,ii}=this.dataset;
    const cur=DATA[si].items[ii].status;
    const nv=cur==='已完成'?'未完成':'已完成';
    if(!ensureEditAllowed()) return;
    DATA[si].items[ii].status=nv;
    saveData();
    this.textContent=nv;
    this.className='status-badge '+(nv==='已完成'?'done':'todo');
    if(window.anime){anime({targets:this,scale:[{value:1.25,duration:140},{value:1,duration:260}],easing:'easeOutBack'});}
    if(nv==='已完成') fireCompletionBurst(this);
    renderKPI(); toast('状态已更新 → '+nv);
  });
}
function bindDateInput(input){
  input.addEventListener('change',function(){
    const {si,ii,k}=this.dataset;

    const v=this.value;

function updateDatePicker(input){

function reindexStageRows(si){

function bindDeleteButton(btn){
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    const si=Number(this.dataset.si), ii=Number(this.dataset.ii);
    const item=DATA[si]&&DATA[si].items[ii];

function bindRowControls(row){
  row.querySelectorAll('.cell[contenteditable="true"]').forEach(bindCell);
  row.querySelectorAll('.date-input').forEach(bindDateInput);
  row.querySelectorAll('.status-badge').forEach(bindStatusBadge);
  row.querySelectorAll('.delete-row-btn').forEach(bindDeleteButton);
}
function appendRowToStage(si,item,ii){
  const s=DATA[si];
  const stage=document.querySelector(`.stage[data-si="${si}"]`);
  const tbody=stage&&stage.querySelector('tbody');
  if(!tbody) return false;
  const cols=s.kind==="savings"?SAVING_COLS:(s.noStat?REBATE_COLS:COLS);
  tbody.insertAdjacentHTML('beforeend',rowHtml(item,si,ii,cols));
  const row=tbody.lastElementChild;
  bindRowControls(row);
  return row;
}
function bindEditing(){
  document.querySelectorAll('.budget-row').forEach(bindRowControls);
  document.querySelectorAll('.add-row-btn').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const si=Number(this.dataset.si);
      if(!ensureEditAllowed()) return;
      const item=emptyItemForStage(DATA[si]);
      DATA[si].items.push(item);
      const ii=DATA[si].items.length-1;
      saveData(); renderKPI(); refreshStageSum(si);
      const row=appendRowToStage(si,item,ii);
      toast('已新增条目');
      setTimeout(()=>{
        const first=row?row.querySelector('.cell'):document.querySelector(`.cell[data-si="${si}"][data-ii="${ii}"]`);
        if(first) first.focus();
      },0);
    });
  });
  document.querySelectorAll('.pin-stage').forEach(btn=>{
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      const si=Number(this.dataset.si);
      const nextPinned=!DATA[si].pinned;
      DATA[si].pinned=nextPinned;
      saveLocalData(); renderKPI(); renderStages();
      saveLayoutChange("set_budget_stage_pinned",{doc_id:CLOUD_DOC_ID,stage_index:si,is_pinned:nextPinned});
      toast(nextPinned?'已标记为正在进行':'已取消置顶');
    });
  });
}
function refreshStageSum(si){
  const s=DATA[si],sum=stageSum(s);
  const el=document.querySelector(`.stage[data-si="${si}"] .stage-sum`);
  if(!el)return;
  if(s.kind==="savings") el.innerHTML=`<span>省下合计 <b>¥${fmt(sum.saved)}</b></span><span>${s.items.length} 项</span>`;
  else if(s.noStat) el.innerHTML=`<span>回收合计 <b>¥${fmt(sum.p)}</b></span><span>${s.items.length} 项</span>`;
  else el.innerHTML=`<span>预算 <b>¥${fmt(sum.b)}</b></span><span>已付 ¥${fmt(sum.p)}</span><span>${s.items.length} 项</span>`;
}

// ====== 折叠 / 滚动动画 ======
function observeStages(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      // anime.js 交错进场：阶段头 + 行依次浮现
      if(window.anime && !prefersReducedMotion() && !e.target._animated){
        e.target._animated=true;
        const rows=e.target.querySelectorAll('tbody tr');
        anime({targets:e.target.querySelector('.stage-head'),translateY:[16,0],opacity:[0,1],duration:500,easing:'easeOutCubic'});
        anime({targets:rows,translateX:[-14,0],opacity:[0,1],delay:anime.stagger(28,{start:120}),duration:420,easing:'easeOutCubic'});
      }
      io.unobserve(e.target);
    }
  }),{threshold:.06});
  document.querySelectorAll('.stage').forEach(s=>io.observe(s));
  document.querySelectorAll('.stage-head').forEach(h=>{
    h.addEventListener('click',e=>{ if(e.target.closest('button,.cell'))return; h.parentElement.classList.toggle('collapsed');});
  });
}

document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('确定恢复到初始数据？你的所有本地修改将被清除。')){
    if(!ensureEditAllowed()) return;
    localStorage.removeItem(LS_KEY); DATA=normalizeData(JSON.parse(JSON.stringify(SEED)));
    saveData(); renderKPI(); renderStages(); toast('已恢复初始数据');
  }
});
// 导出数据为 JSON 文件
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.href=url; a.download='雍贤山庐预算数据-'+d+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('已导出当前数据 ✓');
});
// 导入 JSON 文件
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',function(){
  const f=this.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const arr=JSON.parse(e.target.result);
      if(!Array.isArray(arr)||!arr[0]||!('items' in arr[0])) throw new Error('格式不符');
      if(confirm('确定用导入的数据覆盖当前内容？建议先导出备份。')){
        if(!ensureEditAllowed()) return;
        DATA=normalizeData(arr); saveData(); renderKPI(); renderStages(); toast('导入成功 ✓');
      }
    }catch(err){ alert('导入失败：文件不是有效的预算数据 JSON。\n'+err.message); }
    this.value='';
  };
  rd.readAsText(f);
});
// back to top / 回到流程开始
const topBtn=document.getElementById('top');
const startBtn=document.getElementById('toStart');
window.addEventListener('scroll',()=>{
  const show=window.scrollY>400;
  topBtn.classList.toggle('show',show);
  startBtn.classList.toggle('show',show);
});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
startBtn.addEventListener('click',()=>{
  const first=document.querySelector('#stages .stage');
  if(first){
    const y=first.getBoundingClientRect().top+window.scrollY-12;
    window.scrollTo({top:y,behavior:'smooth'});
    if(window.anime){anime({targets:first,scale:[1.02,1],duration:600,easing:'easeOutElastic(1,.6)'});}
  }
});
function updateMoveCountdown(){
  const el=document.getElementById('moveCountdown');
  if(!el) return;
  let diff=Math.max(0,MOVE_IN_TARGET-Date.now());
  const day=86400000,hour=3600000,minute=60000;
  const d=Math.floor(diff/day); diff-=d*day;
  const h=Math.floor(diff/hour); diff-=h*hour;
  const m=Math.floor(diff/minute); diff-=m*minute;
  const s=Math.floor(diff/1000);
  el.innerHTML=`<span class="countdown-title">距离搬进新家还有</span><span class="countdown-time">
    <span class="countdown-unit"><span class="countdown-num">${d}</span><span class="countdown-label">天</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(h).padStart(2,'0')}</span><span class="countdown-label">时</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(m).padStart(2,'0')}</span><span class="countdown-label">分</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(s).padStart(2,'0')}</span><span class="countdown-label">秒</span></span>
  </span>`;
}
updateMoveCountdown();
setInterval(updateMoveCountdown,1000);

// ====== 图表（纯 Canvas 自绘）======
function setupCanvas(cv, cssH){
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth || cv.parentElement.clientWidth-40;
  cv.width = w*dpr; cv.height = cssH*dpr;
  cv.style.height = cssH+'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h:cssH};
}
let chartAnim=0;
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function drawCharts(){
  cancelAnimationFrame(chartAnim);
  const t0=performance.now(), dur=prefersReducedMotion()?0:700, ease=t=>1-Math.pow(1-t,3);
  function frame(now){
    const p=dur ? Math.min((now-t0)/dur,1) : 1, e=ease(p);
    drawBar(e); drawDonut(e);
    if(p<1) chartAnim=requestAnimationFrame(frame);
  }
  chartAnim=requestAnimationFrame(frame);
}
function stageData(){
  return DATA.filter(s=>s.items.length && !s.noStat && s.kind!=="savings").map(s=>{
    let b=0,pd=0; s.items.forEach(it=>{b+=Number(it.budget)||0;pd+=Number(it.paid)||0;});
    return {name:s.stage.replace(/^\d+\s*/,''), budget:b, paid:pd};
  }).filter(d=>d.budget>0||d.paid>0);
}
function drawBar(prog){
  const cv=document.getElementById('barChart'); if(!cv)return;
  const rows=stageData();
  const H=Math.max(300, rows.length*40+30);
  const {ctx,w}=setupCanvas(cv,H);
  ctx.clearRect(0,0,w,H);
  const padL=110, padR=72, padT=8, padB=10;
  const max=Math.max(...rows.map(d=>Math.max(d.budget,d.paid)),1);
  const chartW=w-padL-padR, rowH=(H-padT-padB)/rows.length, bh=Math.min(11,rowH/3);
  ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  rows.forEach((d,i)=>{
    const cy=padT+i*rowH+rowH/2;
    // label
    ctx.fillStyle=cssVar('--ink'); ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(d.name.length>7?d.name.slice(0,7):d.name, padL-10, cy);
    // budget bar
    const bw=chartW*(d.budget/max)*prog;
    roundRect(ctx,padL,cy-bh-1,bw,bh,3); ctx.fillStyle=cssVar('--chart-budget'); ctx.fill();
    ctx.strokeStyle=cssVar('--chart-budget'); ctx.lineWidth=1;
    roundRect(ctx,padL,cy-bh-1,bw,bh,3); ctx.stroke();
    // paid bar
    const pw=chartW*(d.paid/max)*prog;
    if(d.paid>0){
      roundRect(ctx,padL,cy+1,pw,bh,3); ctx.fillStyle=cssVar('--chart-paid'); ctx.fill();
    }else{
      ctx.beginPath();
      ctx.moveTo(padL,cy+1);
      ctx.lineTo(padL+22,cy+1);
      ctx.strokeStyle=cssVar('--chart-zero');
      ctx.lineWidth=2;
      ctx.stroke();
    }
    // value labels (both bars)
    if(prog>0.9){
      ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.font='10px sans-serif';
      ctx.fillStyle=cssVar('--chart-budget'); ctx.fillText('¥'+fmt(d.budget), padL+bw+5, cy-bh/2-1);
      ctx.fillStyle=d.paid>0 ? cssVar('--chart-paid') : cssVar('--chart-zero');
      ctx.fillText(d.paid>0 ? '¥'+fmt(d.paid) : '¥0', padL+(d.paid>0?pw:24)+5, cy+bh/2+2);
    }
    ctx.font='11px "PingFang SC",sans-serif';
  });
}
function drawDonut(prog){
  const cv=document.getElementById('donutChart'); if(!cv)return;
  const {ctx,w,h}=setupCanvas(cv,240);
  ctx.clearRect(0,0,w,h);
  const k=calcKPI();
  const parts=[
    {l:'已付款',v:k.paid,c:cssVar('--chart-paid')},
    {l:'待安排资金',v:Math.max(k.remain,0),c:cssVar('--chart-budget')},
  ];
  const total=parts.reduce((s,p)=>s+p.v,0)||1;
  const cx=w/2, cy=h/2-4, R=Math.min(w,h)/2-34, r=R*0.58;
  let start=-Math.PI/2;
  parts.forEach(pt=>{
    const ang=(pt.v/total)*Math.PI*2*prog;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,start,start+ang); ctx.closePath();
    ctx.fillStyle=pt.c; ctx.fill();
    start+=ang;
  });
  // inner hole
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=cssVar('--card'); ctx.fill();
  // center text
  ctx.fillStyle=cssVar('--dark'); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 20px "PingFang SC",sans-serif';
  const donePct=Math.round(k.paid/(k.budget||1)*100*prog);
  ctx.fillText(donePct+'%', cx, cy-6);
  ctx.fillStyle=cssVar('--muted'); ctx.font='11px "PingFang SC",sans-serif';
  ctx.fillText('已付占预算', cx, cy+14);
  // legend
  if(prog>0.95){
    const lg=document.getElementById('donutLegend');
    lg.innerHTML=parts.map(p=>`<span><i style="background:${p.c}"></i>${p.l} ¥${fmt(p.v)}</span>`).join('');
  }
}
function roundRect(ctx,x,y,w,h,r){
  if(w<0){x+=w;w=-w;} r=Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
window.addEventListener('resize',()=>{drawBar(1);drawDonut(1);});
// 图表卡片进场
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:.1})
  .observe(document.querySelector('.charts .chart-card'));
document.querySelectorAll('.chart-card').forEach((c,i)=>{c.style.animationDelay=(i*.12)+'s';c.classList.add('in');});

syncThemeButton();
renderKPI(); renderStages();
initCloudData();

  anime({targets:'.kpi',translateY:[28,0],opacity:[0,1],scale:[.94,1],delay:anime.stagger(80,{start:120}),duration:640,easing:'easeOutBack'});
  anime({targets:'header h1',translateY:[-20,0],opacity:[0,1],duration:700,easing:'easeOutCubic'});
}
