<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雍贤山庐装修时间线</title>
<script>
(function(){
  try{
    const theme=localStorage.getItem('yxsl_budget_theme');
    if(theme==='dark') document.documentElement.dataset.theme='dark';
  }catch(e){}
})();
</script>
<style>
:root{
  --dark:#214E3B;--green:#376B55;--gold:#C79A52;--red:#C95252;--blue:#2F6E8F;
  --bg:#F4F7F5;--card:rgba(255,255,255,.62);--line:rgba(33,78,59,.14);--ink:#24312B;--muted:#68756F;
  --body-bg:radial-gradient(circle at 20% 0%,rgba(199,154,82,.16),transparent 32%),linear-gradient(135deg,#EDF4EF 0%,#F4F7F5 100%);
  --shadow:rgba(33,78,59,.12);--header-start:#214E3B;--header-end:#376B55;
}
:root[data-theme="dark"]{
  --dark:#D9EFE4;--green:#A7D8BD;--gold:#D6A95E;--red:#E17870;--blue:#82C4DE;
  --bg:#111815;--card:rgba(24,35,30,.66);--line:rgba(255,255,255,.1);--ink:#EDF5F0;--muted:#A9B9B0;
  --body-bg:radial-gradient(circle at 20% 0%,rgba(214,169,94,.14),transparent 34%),linear-gradient(135deg,#0E1512 0%,#16211C 100%);
  --shadow:rgba(0,0,0,.34);--header-start:#14221C;--header-end:#203A2F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--body-bg);color:var(--ink);line-height:1.55;min-height:100vh;padding-bottom:64px}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(244,247,245,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
:root[data-theme="dark"] .topbar{background:rgba(17,24,21,.72)}
.top-inner{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--dark)}
.brand-mark{width:10px;height:28px;border-radius:999px;background:linear-gradient(var(--gold),var(--blue));box-shadow:0 8px 18px rgba(199,154,82,.28)}
.nav-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--dark);border-radius:10px;padding:9px 14px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px var(--shadow);border-color:rgba(199,154,82,.5)}
.hero{max-width:1120px;margin:0 auto;padding:34px 20px 18px}
.hero h1{font-size:34px;line-height:1.15;color:var(--dark);letter-spacing:0;margin-bottom:0}
.countdown{
  display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 12px 28px var(--shadow),inset 0 1px rgba(255,255,255,.32);
}
.countdown-title{font-size:13px;color:var(--muted);font-weight:700}
.countdown-time{display:flex;gap:7px;flex-wrap:wrap}
.countdown-unit{display:flex;align-items:baseline;gap:3px}
.countdown-num{min-width:2.8ch;text-align:center;border-radius:8px;padding:3px 8px;background:linear-gradient(135deg,rgba(199,154,82,.16),rgba(47,110,143,.12));color:var(--dark);font-weight:900;font-variant-numeric:tabular-nums}
.countdown-unit:first-child .countdown-num{min-width:3.8ch}
.countdown-label{font-size:11px;color:var(--muted);font-weight:700}
.timeline-wrap{max-width:1120px;margin:0 auto;padding:16px 20px 44px;position:relative}
.timeline{--branch-canvas-height:310px;position:relative;display:grid;gap:22px}
.timeline::before{
  content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;transform:translateX(-50%);
  background:linear-gradient(transparent,var(--gold),var(--blue),transparent);
}
.milestone{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);min-height:var(--branch-canvas-height);align-items:stretch;opacity:0;transform:translateY(28px);transition:.6s cubic-bezier(.2,.8,.2,1)}
.milestone.in{opacity:1;transform:translateY(0)}
.milestone:nth-child(odd) .panel{grid-column:1}
.milestone:nth-child(even) .panel{grid-column:3}
.rail{grid-column:2;grid-row:1;align-self:center;display:flex;justify-content:center;position:relative;z-index:2}
.node{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,var(--green),var(--blue));border:3px solid rgba(255,255,255,.72);
  box-shadow:0 12px 26px var(--shadow),0 0 0 7px rgba(199,154,82,.12);
  transition:transform .3s,box-shadow .3s,background .3s;
}
.milestone.completed .node{background:linear-gradient(135deg,#17633F,#2E8B5D);box-shadow:0 10px 24px rgba(23,99,63,.3),0 0 0 7px rgba(46,139,93,.14)}
.milestone.pending .node{background:linear-gradient(135deg,#68766F,#8D9993);box-shadow:0 8px 18px rgba(45,58,51,.18),0 0 0 6px rgba(104,118,111,.1)}
.milestone.target .node{background:linear-gradient(135deg,#255D78,#428FAF);box-shadow:0 10px 24px rgba(37,93,120,.26),0 0 0 7px rgba(66,143,175,.14)}
.milestone.current .node{
  background:linear-gradient(135deg,#F4B640,#C75B18);transform:scale(1.12);border-color:#FFF3CF;
  box-shadow:0 14px 32px rgba(199,91,24,.42),0 0 0 9px rgba(244,182,64,.24);animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 16px 36px rgba(199,91,24,.48),0 0 0 16px rgba(244,182,64,.18)}}
.panel{
  position:relative;align-self:center;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:8px;
  backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);
  box-shadow:0 12px 30px var(--shadow),inset 0 1px rgba(255,255,255,.28);padding:18px;transition:.3s cubic-bezier(.2,.8,.2,1);
}
.milestone.completed .panel{border-left:4px solid #2E8B5D}
.milestone.pending .panel{border-left:4px solid #8D9993}
.milestone.target .panel{border-left:4px solid #428FAF}
.milestone.current .panel{
  border:2px solid #E89A1F;background:linear-gradient(135deg,rgba(255,247,225,.92),rgba(255,255,255,.72));
  box-shadow:0 20px 44px rgba(199,91,24,.24),0 0 0 5px rgba(244,182,64,.14),inset 0 1px rgba(255,255,255,.56);
}
:root[data-theme="dark"] .milestone.current .panel{background:linear-gradient(135deg,rgba(80,52,20,.9),rgba(35,31,24,.82))}
.panel::after{
  content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.22),transparent 65%);
  transform:translateX(-120%);transition:.75s cubic-bezier(.2,.8,.2,1);
}
.panel:hover{transform:translateY(-6px) scale(1.018);box-shadow:0 20px 42px var(--shadow),inset 0 1px rgba(255,255,255,.42);border-color:rgba(199,154,82,.46)}
.panel:hover::after{transform:translateX(120%)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.date{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.state{font-size:12px;border-radius:999px;padding:3px 9px;background:rgba(55,107,85,.12);color:var(--green);font-weight:800}
.milestone.completed .state{background:#17633F;color:#fff}
.milestone.pending .state{background:rgba(104,118,111,.16);color:var(--muted)}
.milestone.target .state{background:#255D78;color:#fff}
.milestone.current .state{background:#C75B18;color:#fff;box-shadow:0 5px 14px rgba(199,91,24,.3)}
.panel h2{font-size:20px;color:var(--dark);letter-spacing:0;margin-bottom:7px}
.panel p{font-size:13px;color:var(--muted);margin-bottom:13px}
.stage-stats{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.stat-pill{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;border:1px solid var(--line)}
.stat-pill.price{background:rgba(199,154,82,.13);color:#8B5E16;border-color:rgba(199,154,82,.28)}
:root[data-theme="dark"] .stat-pill.price{color:#F0C77F}
.branch-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;background:rgba(255,255,255,.34);color:var(--dark);font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
}
:root[data-theme="dark"] .branch-toggle{background:rgba(255,255,255,.06)}
.branch-toggle:hover{background:rgba(199,154,82,.12);border-color:rgba(199,154,82,.46)}
.branch-toggle:active{transform:scale(.99)}
.branch-icon{font-size:18px;line-height:1;transition:transform .25s}
.branch-toggle[aria-expanded="true"] .branch-icon{transform:rotate(45deg)}
.branches{grid-row:1;position:relative;display:grid;align-content:center;gap:6px;min-width:0;height:var(--branch-canvas-height);padding:12px 0 12px 26px;opacity:1;transition:opacity .2s ease}
.milestone:nth-child(odd) .branches{grid-column:3}
.milestone:nth-child(even) .branches{grid-column:1;padding:12px 26px 12px 0}
.branches[hidden]{display:grid!important;visibility:hidden;opacity:0;pointer-events:none}
.branches.dense{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:5px}
.branches::before,.branches::after,.branch-item::before{content:"";position:absolute;background:rgba(199,154,82,.68)}
.branches::before{left:-36px;top:50%;width:50px;height:2px}
.branches::after{left:14px;top:22px;bottom:22px;width:2px}
.milestone:nth-child(even) .branches::before{left:auto;right:-36px}
.milestone:nth-child(even) .branches::after{left:auto;right:14px}
.branch-item{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
  padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 5px 14px var(--shadow);cursor:grab;touch-action:manipulation;
}
.branch-item:active{cursor:grabbing}
.branch-item.dragging{opacity:.42;border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,82,.2);pointer-events:none}
.branch-item.drag-over{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,154,82,.18)}
.branch-item::before{left:-12px;top:50%;width:12px;height:2px}
.milestone:nth-child(even) .branch-item::before{left:auto;right:-12px}
.branch-name{min-width:0;color:var(--ink);font-size:12px;font-weight:700;line-height:1.3;word-break:break-word}
.branch-price{color:var(--dark);font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.branch-empty{padding:10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;text-align:center;background:var(--card)}
.milestone.current .branch-item{border-color:rgba(232,154,31,.58);box-shadow:0 6px 18px rgba(199,91,24,.16)}
@media(max-width:760px){
  .hero h1{font-size:26px}
  .timeline::before{left:26px}
  .timeline{--branch-canvas-height:280px}
  .milestone{grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
  .milestone:nth-child(odd) .panel,.milestone:nth-child(even) .panel{grid-column:2}
  .rail{grid-column:1}
  .node{width:44px;height:44px;font-size:12px}
  .milestone.current .node{transform:scale(1.06)}
  .milestone:nth-child(odd) .branches,.milestone:nth-child(even) .branches{grid-column:2;grid-row:2;height:var(--branch-canvas-height);padding:10px 0 0 24px}
  .branches.dense{column-gap:10px;row-gap:5px}
  .milestone:nth-child(odd) .branches::before,.milestone:nth-child(even) .branches::before{left:-36px;right:auto;top:27px;width:50px}
  .milestone:nth-child(odd) .branches::after,.milestone:nth-child(even) .branches::after{left:14px;right:auto;top:20px;bottom:12px}
  .milestone:nth-child(odd) .branch-item::before,.milestone:nth-child(even) .branch-item::before{left:-10px;right:auto;width:10px}
  .countdown{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}
  .milestone{opacity:1;transform:none}
  .panel:hover{transform:none}
}
</style>
</head>
<body>
<nav class="topbar">
  <div class="top-inner">
    <div class="brand"><span class="brand-mark"></span><span>装修时间线</span></div>
    <div class="nav-actions">
      <a class="btn" href="index.html">返回预算表</a>
      <button class="btn" id="themeToggle">深色模式</button>
    </div>
  </div>
</nav>
<main>
  <section class="hero">
    <h1>从毛坯到新家，每一步都看得见</h1>
    <div class="countdown" id="moveCountdown"></div>
  </section>
  <section class="timeline-wrap">
    <div class="timeline" id="timeline"></div>
  </section>
</main>
<script>
const MOVE_IN_TARGET=new Date("2027-01-01T00:00:00+08:00").getTime();
const BUDGET_STORAGE_KEY="yxsl_budget_v7";
const TIMELINE_ORDER_KEY="yxsl_timeline_branch_order_v1";
const ITEMS=[
  {date:"2026年4-5月",icon:"交付",title:"房屋交付前",state:"已完成",stageKeys:["01 房屋交付前"],text:"验房、设计、物业手续先落地，预算表从这里开始。"},
  {date:"2026年5-6月",icon:"拆改",title:"开工准备与拆改",state:"已完成",stageKeys:["02 开工准备与拆改"],text:"施工节奏启动，拆改、封窗、砌筑这些基础动作先走完。"},
  {date:"2026年6月",icon:"水电",title:"水电与隐蔽工程",state:"已完成",stageKeys:["03 水电与隐蔽工程"],text:"隐蔽工程决定后面的稳定性，水电材料和开孔一起核对。"},
  {date:"2026年7月",icon:"瓷砖",title:"防水与瓦工瓷砖",state:"已完成",stageKeys:["04 防水与瓦工瓷砖"],text:"防水、瓦工和瓷砖施工已经完成。"},
  {date:"2026年8月",icon:"木工",title:"木工与吊顶",state:"已完成",stageKeys:["05 木工与吊顶"],text:"木作基层和吊顶影响空间比例，适合和灯位、风口一起复核。"},
  {date:"2026年9月",icon:"油漆",title:"墙面与油漆",state:"进行中",stageKeys:["06 墙面与油漆"],text:"墙面进入显性效果阶段，颜色、基层、修补细节都要收口。"},
  {date:"2026年10-11月",icon:"安装",title:"主材与安装",state:"待推进",stageKeys:["07 主材与安装"],text:"门、卫浴、灯具、开关面板集中安装，预算波动会比较明显。"},
  {date:"2026年11-12月",icon:"软装",title:"家具软装与家电",state:"待推进",stageKeys:["09 家具与软装","10 家电与智能家居"],text:"从功能完成走向入住质感，家具、家电、窗帘一起补齐。"},
  {date:"2026年12月",icon:"验收",title:"保洁验收",state:"待推进",stageKeys:["11 保洁验收与入住"],text:"开荒、验收、问题修补，给入住前最后一轮整理留时间。"},
  {date:"2027年1月",icon:"入住",title:"搬进新家",state:"目标",stageKeys:["12 结算与备用金"],text:"把账、物、空间一起收束，正式进入新家的日常。"}
];
const money=new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",minimumFractionDigits:0,maximumFractionDigits:1});
const escapeHTML=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
const formatMoney=value=>money.format(Number(value)||0).replace("CN¥","¥");
function getBranchOrders(){
  try{return JSON.parse(localStorage.getItem(TIMELINE_ORDER_KEY)||"{}")}catch(error){return {}}
}
function saveBranchOrders(orders){
  try{localStorage.setItem(TIMELINE_ORDER_KEY,JSON.stringify(orders))}catch(error){console.warn("保存子项顺序失败",error)}
}
function branchDate(entry){
  const match=String(entry.date||"").trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if(!match)return "";
  return `${match[1]}-${match[2].padStart(2,"0")}-${match[3].padStart(2,"0")}`;
}
function chronologicalBranches(entries){
  return [...entries].sort((a,b)=>{
    const aDate=branchDate(a.entry),bDate=branchDate(b.entry);
    if(!aDate&&!bDate)return a.originalIndex-b.originalIndex;
    if(!aDate)return -1;
    if(!bDate)return 1;
    return aDate.localeCompare(bDate)||a.originalIndex-b.originalIndex;
  });
}
function orderedBranches(entries,milestoneIndex){
  const defaults=chronologicalBranches(entries);
  const order=getBranchOrders()[milestoneIndex];
  if(!Array.isArray(order)||!order.length)return defaults;
  const positions=new Map(order.map((id,index)=>[id,index]));
  return [...defaults].sort((a,b)=>{
    const aPosition=positions.has(a.id)?positions.get(a.id):Number.MAX_SAFE_INTEGER;
    const bPosition=positions.has(b.id)?positions.get(b.id):Number.MAX_SAFE_INTEGER;
    return aPosition-bPosition||defaults.indexOf(a)-defaults.indexOf(b);
  });
}
function stateClass(state){
  if(state==="已完成")return "completed";
  if(state==="进行中")return "current";
  if(state==="目标")return "target";
  return "pending";
}
function resolveStates(stageGroups){
  const states=ITEMS.map(item=>item.state);
  let currentIndex=states.indexOf("进行中");
  while(currentIndex>=0&&currentIndex<ITEMS.length){
    const items=stageGroups[currentIndex];
    const allCompleted=items.length>0&&items.every(entry=>entry.status==="已完成");
    if(!allCompleted)break;
    states[currentIndex]="已完成";
    currentIndex+=1;
    if(currentIndex<ITEMS.length)states[currentIndex]="进行中";
  }
  return states;
}
async function loadBudgetStages(){
  try{
    const saved=localStorage.getItem(BUDGET_STORAGE_KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      if(Array.isArray(parsed))return parsed;
    }
  }catch(error){console.warn("读取本地预算失败",error)}
  try{
    const response=await fetch("../data/budget-seed.json",{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const parsed=await response.json();
    if(Array.isArray(parsed))return parsed;
  }catch(error){console.warn("读取预算种子数据失败",error)}
  return [];
}
function updateThemeButton(){
  const btn=document.getElementById('themeToggle');
  btn.textContent=document.documentElement.dataset.theme==='dark'?'浅色模式':'深色模式';
}
document.getElementById('themeToggle').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme!=='dark';
  document.documentElement.dataset.theme=dark?'dark':'';
  try{localStorage.setItem('yxsl_budget_theme',dark?'dark':'light');}catch(e){}
  updateThemeButton();
});
function renderCountdown(){
  const el=document.getElementById('moveCountdown');
  let diff=Math.max(0,MOVE_IN_TARGET-Date.now());
  const day=86400000,hour=3600000,minute=60000;
  const d=Math.floor(diff/day); diff-=d*day;
  const h=Math.floor(diff/hour); diff-=h*hour;
  const m=Math.floor(diff/minute); diff-=m*minute;
  const s=Math.floor(diff/1000);
  el.innerHTML=`<span class="countdown-title">距离 2027年1月1日 搬进新家还有</span><span class="countdown-time">
    <span class="countdown-unit"><span class="countdown-num">${d}</span><span class="countdown-label">天</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(h).padStart(2,'0')}</span><span class="countdown-label">时</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(m).padStart(2,'0')}</span><span class="countdown-label">分</span></span>
    <span class="countdown-unit"><span class="countdown-num">${String(s).padStart(2,'0')}</span><span class="countdown-label">秒</span></span>
  </span>`;
}
function renderTimeline(budgetStages){
  const hasBudgetData=budgetStages.length>0;
  const stageGroups=ITEMS.map(item=>budgetStages.filter(stage=>item.stageKeys.includes(stage.stage)).flatMap(stage=>(stage.items||[]).map((entry,itemIndex)=>({
    entry,id:`${stage.stage}|${entry.date||""}|${entry.cat||""}|${entry.space||""}|${entry.name||""}|${entry.paid||0}|${entry.note||""}`,originalIndex:itemIndex
  }))));
  const resolvedStates=resolveStates(stageGroups.map(group=>group.map(branch=>branch.entry)));
  document.getElementById('timeline').innerHTML=ITEMS.map((item,index)=>{
    const branchEntries=orderedBranches(stageGroups[index],index);
    const stageItems=branchEntries.map(branch=>branch.entry);
    const resolvedState=resolvedStates[index];
    const totalSpent=stageItems.reduce((sum,entry)=>sum+(Number(entry.paid)||0),0);
    const branchLayout=stageItems.length>5?" dense":"";
    const branches=stageItems.length?branchEntries.map(({entry,id})=>`
      <div class="branch-item" draggable="true" data-branch-id="${escapeHTML(id)}" title="长按或拖拽以调整顺序">
        <span class="branch-name">${escapeHTML(entry.name||entry.cat||"未命名子项")}</span>
        <strong class="branch-price">${formatMoney(entry.paid)}</strong>
      </div>`).join(""):`<div class="branch-empty">${hasBudgetData?"暂无子项":"数据暂时无法读取"}</div>`;
    return `
    <article class="milestone ${stateClass(resolvedState)}">
      <div class="panel">
        <div class="meta"><span class="date">${escapeHTML(item.date)}</span><span class="state">${escapeHTML(resolvedState)}</span></div>
        <h2>${escapeHTML(item.title)}</h2>
        <p>${escapeHTML(item.text)}</p>
        <div class="stage-stats">
          <span class="stat-pill price">阶段花费 ${hasBudgetData?formatMoney(totalSpent):"待定"}</span>
        </div>
        <button class="branch-toggle" type="button" aria-expanded="false" aria-controls="branches-${index}">
          <span>查看子项 · ${stageItems.length} 项</span><span class="branch-icon">＋</span>
        </button>
      </div>
      <div class="rail"><div class="node">${escapeHTML(item.icon)}</div></div>
      <div class="branches${branchLayout}" id="branches-${index}" hidden>${branches}</div>
    </article>`}).join('');
}
renderCountdown();
setInterval(renderCountdown,1000);
updateThemeButton();
document.getElementById("timeline").addEventListener("click",event=>{
  const button=event.target.closest(".branch-toggle");
  if(!button)return;
  const branches=document.getElementById(button.getAttribute("aria-controls"));
  const expanded=button.getAttribute("aria-expanded")==="true";
  button.setAttribute("aria-expanded",String(!expanded));
  button.querySelector("span:first-child").textContent=`${expanded?"查看":"收起"}子项 · ${branches.querySelectorAll(".branch-item").length} 项`;
  branches.hidden=expanded;
});
function persistBranchOrder(container){
  const milestoneIndex=Number(container.id.replace("branches-",""));
  if(!Number.isInteger(milestoneIndex))return;
  const orders=getBranchOrders();
  orders[milestoneIndex]=[...container.querySelectorAll(".branch-item")].map(item=>item.dataset.branchId);
  saveBranchOrders(orders);
}
function placeBranch(dragged,target,clientY){
  if(!dragged||!target||dragged===target||dragged.parentElement!==target.parentElement)return;
  const rect=target.getBoundingClientRect();
  target.parentElement.insertBefore(dragged,clientY<rect.top+rect.height/2?target:target.nextSibling);
}
let touchDrag=null;
document.getElementById("timeline").addEventListener("dragstart",event=>{
  const item=event.target.closest(".branch-item");
  if(!item)return;
  item.classList.add("dragging");
  event.dataTransfer.effectAllowed="move";
  event.dataTransfer.setData("text/plain",item.dataset.branchId);
});
document.getElementById("timeline").addEventListener("dragover",event=>{
  const target=event.target.closest(".branch-item");
  const dragged=document.querySelector(".branch-item.dragging");
  if(!target||!dragged||target.parentElement!==dragged.parentElement)return;
  event.preventDefault();
  target.parentElement.querySelectorAll(".drag-over").forEach(item=>item.classList.remove("drag-over"));
  if(target!==dragged)target.classList.add("drag-over");
});
document.getElementById("timeline").addEventListener("drop",event=>{
  const target=event.target.closest(".branch-item");
  const dragged=document.querySelector(".branch-item.dragging");
  if(!target||!dragged||target.parentElement!==dragged.parentElement)return;
  event.preventDefault();
  placeBranch(dragged,target,event.clientY);
  persistBranchOrder(target.parentElement);
  target.parentElement.querySelectorAll(".drag-over").forEach(item=>item.classList.remove("drag-over"));
});
document.getElementById("timeline").addEventListener("dragend",event=>{
  const item=event.target.closest(".branch-item");
  item?.classList.remove("dragging");
  item?.parentElement?.querySelectorAll(".drag-over").forEach(target=>target.classList.remove("drag-over"));
});
document.getElementById("timeline").addEventListener("pointerdown",event=>{
  if(event.pointerType==="mouse")return;
  const item=event.target.closest(".branch-item");
  if(!item)return;
  const timer=setTimeout(()=>{
    if(!touchDrag)return;
    touchDrag.active=true;
    item.classList.add("dragging");
    item.setPointerCapture?.(event.pointerId);
  },220);
  touchDrag={item,pointerId:event.pointerId,timer,active:false};
});
document.getElementById("timeline").addEventListener("pointermove",event=>{
  if(!touchDrag||touchDrag.pointerId!==event.pointerId||!touchDrag.active)return;
  event.preventDefault();
  const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(".branch-item");
  if(target&&target.parentElement===touchDrag.item.parentElement)placeBranch(touchDrag.item,target,event.clientY);
});
function finishTouchDrag(event){
  if(!touchDrag||touchDrag.pointerId!==event.pointerId)return;
  clearTimeout(touchDrag.timer);
  if(touchDrag.active){
    persistBranchOrder(touchDrag.item.parentElement);
    touchDrag.item.classList.remove("dragging");
  }
  touchDrag=null;
}
document.getElementById("timeline").addEventListener("pointerup",finishTouchDrag);
document.getElementById("timeline").addEventListener("pointercancel",finishTouchDrag);
async function initTimeline(){
  renderTimeline(await loadBudgetStages());
  const io=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('in');
      io.unobserve(entry.target);
    }
  }),{threshold:.12});
  document.querySelectorAll('.milestone').forEach((item,index)=>{
    item.style.transitionDelay=(index*.05)+'s';
    io.observe(item);
  });
}
initTimeline();
</script>
